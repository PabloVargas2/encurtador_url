name: Deploy to production
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

job:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test    

      - name: Build project
        run: npm run build