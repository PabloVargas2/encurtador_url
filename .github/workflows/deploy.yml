name: Integração Contínua
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: lint code
        run: npm run lint

  deploy:
      runs-on: ubuntu-latest
      needs: build 
      if: github.event_name == 'push'

      steps:
      - name: Verificar configuração do servidor
        run: |
          echo "Verificando HOST configurado..."
          echo "HOST=$HOST"
          echo "Testando conexão SSH..."
          nc -vz -w 10 "$HOST" 22
        env:
          HOST: ${{ secrets.HOST }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: HOST
          script: |
            set -e
            cloud-init status --wait > /dev/null || true
            if ! command -v pm2 > /dev/null; then
              echo "pm2 nao encontrado: veja /var/log/cloud-init-output.log"
              exit 1
            fi
            if [ ! -d "encurtador_url" ]; then
              git clone https://github.com/PabloVargas2/encurtador_url.git
            fi
            cd encurtador_url
            git pull origin main
            npm ci --omit=dev
            export BASE_URL="http://$HOST:3000"
            pm2 reload encurtador_url --update-env || pm2 start src/server.js --name encurtador_url
            pm2 save
        env:
          HOST: ${{ secrets.HOST }}
