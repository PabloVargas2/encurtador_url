name: Integração Contínua
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm test
      - run: npm run lint

  infra:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    outputs:
      host: ${{ steps.ip.outputs.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #AWS Academy
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-2

      - name: Criar/atualizar EC2
        run: aws cloudformation deploy --template-file IaC/ec2.yml --stack-name encurtador-url --parameter-overrides KeyName=${{ secrets.KEY_NAME }} --no-fail-on-empty-changeset

      - name: Pegar IP
        id: ip
        run: echo "host=$(aws cloudformation describe-stacks --stack-name encurtador-url --query "Stacks[0].Outputs[?OutputKey=='PublicIp'].OutputValue" --output text)" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.infra.outputs.host }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cloud-init status --wait
            if [ ! -d "encurtador_url" ]; then
              git clone https://github.com/PabloVargas2/encurtador_url.git
            fi
            cd encurtador_url
            git pull origin main
            npm ci --omit=dev
            export BASE_URL=http://${{ needs.infra.outputs.host }}:3000
            pm2 reload encurtador_url --update-env || pm2 start src/server.js --name encurtador_url
            pm2 save
