name: Integração Contínua
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: lint code
        run: npm run lint

  deploy:
      runs-on: ubuntu-latest
      needs: build 
      if: github.event_name == 'push'

      steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
           set -e
            if [ ! -d "encurtador_url" ]; then
              git clone https://github.com/PabloRVargas/encurtador_url.git
            fi
            cd encurtador_url
            git pull origin main
            npm ci --omit=dev
            pm2 reload encurtador_url || pm2 start src/server.js --name encurtador_url
            pm2 save